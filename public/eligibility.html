<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Eligibility | Welfare India</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <nav>
        <div class="logo">
            <i class="fas fa-landmark"></i> <span data-i18n="nav_logo">Welfare India</span>
        </div>
        <div class="menu-toggle">
            <i class="fas fa-bars"></i>
        </div>
        <ul class="nav-links">
            <li><a href="index.html" data-i18n="nav_home">Home</a></li>
            <li><a href="schemes.html" data-i18n="nav_schemes">Schemes</a></li>
            <li><a href="updates.html" data-i18n="nav_updates">Updates</a></li>
            <li><a href="eligibility.html" class="active" data-i18n="nav_eligibility">Check Eligibility</a></li>
            <li><a href="quiz.html" data-i18n="nav_quiz">Quiz</a></li>
            <li><a href="contact.html" data-i18n="nav_feedback">Feedback</a></li>
        </ul>
    </nav>

    <div class="container">
        <h2 class="section-title" data-i18n="eligibility_title">Eligibility Checker</h2>
        <p style="text-align: center; margin-bottom: 30px;" data-i18n="eligibility_subtitle">Enter your details to find schemes relevant to you.</p>

        <div style="max-width: 600px; margin: 0 auto;">
            <form id="eligibility-form" class="scheme-card" style="border-top: 5px solid var(--primary-color);">
                <div class="form-group">
                    <label data-i18n="label_age">Age</label>
                    <input type="number" id="age" class="form-control" required min="0" max="120">
                </div>

                <div class="form-group">
                    <label data-i18n="label_gender">Gender</label>
                    <select id="gender" class="form-control">
                        <option value="Any" data-i18n="opt_select_gender">Select Gender</option>
                        <option value="Male" data-i18n="opt_male">Male</option>
                        <option value="Female" data-i18n="opt_female">Female</option>
                        <option value="Transgender" data-i18n="opt_transgender">Transgender</option>
                    </select>
                </div>

                <div class="form-group">
                    <label data-i18n="label_income">Annual Family Income (Rs.)</label>
                    <input type="number" id="income" class="form-control" placeholder="e.g. 500000" required>
                </div>

                <div class="form-group">
                    <label data-i18n="label_occupation">Occupation</label>
                    <select id="occupation" class="form-control">
                        <option value="" data-i18n="opt_select_occupation">Select Occupation</option>
                        <option value="Student" data-i18n="opt_student">Student</option>
                        <option value="Farmer" data-i18n="opt_farmer">Farmer</option>
                        <option value="Unemployed" data-i18n="opt_unemployed">Unemployed</option>
                        <option value="Government Employee" data-i18n="opt_govt_emp">Government Employee</option>
                        <option value="Private Employee" data-i18n="opt_private_emp">Private Employee</option>
                        <option value="Senior Citizen" data-i18n="opt_senior">Senior Citizen</option>
                    </select>
                </div>

                <button type="submit" class="btn" style="width: 100%;" data-i18n="btn_check">Check Eligibility</button>
            </form>
        </div>

        <div id="results" style="margin-top: 40px; display: none;">
            <h3 class="section-title" data-i18n="results_title">Recommended Schemes</h3>
            <div id="results-list" class="grid"></div>
        </div>
    </div>

    <footer>
        <p data-i18n="footer_rights">© 2026 Welfare India. All Rights Reserved.</p>
    </footer>

    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
    <script src="js/eligibility.js"></script>
</body>

</html>
