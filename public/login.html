<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Welfare India</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 3rem auto;
            padding: 2rem;
            background: var(--white);
            border-radius: 10px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .google-btn { background-color: #dd4b39; color: white; width: 100%; margin-top: 10px; }
        .google-btn:hover { background-color: #c23321; }
    </style>
</head>

<body>
    <nav>
        <div class="logo">
            <i class="fas fa-landmark"></i> <span data-i18n="nav_logo">Welfare India</span>
        </div>
        <div class="menu-toggle">
            <i class="fas fa-bars"></i>
        </div>
        <ul class="nav-links">
            <li><a href="index.html" data-i18n="nav_home">Home</a></li>
            <li><a href="schemes.html" data-i18n="nav_schemes">Schemes</a></li>
            <li><a href="updates.html" data-i18n="nav_updates">Updates</a></li>
            <li><a href="eligibility.html" data-i18n="nav_eligibility">Check Eligibility</a></li>
            <li><a href="quiz.html" data-i18n="nav_quiz">Quiz</a></li>
            <li><a href="contact.html" data-i18n="nav_feedback">Feedback</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="auth-container">
            <h2 class="section-title" data-i18n="login_title">Login</h2>
            <form id="login-form">
                <div class="form-group" style="text-align: left;">
                    <label data-i18n="label_email">Email</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="form-group" style="text-align: left;">
                    <label data-i18n="label_password">Password</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;" data-i18n="btn_login">Login</button>
            </form>

            <p style="margin: 15px 0;" data-i18n="login_or">OR</p>

            <button id="google-login-btn" class="btn google-btn">
                <i class="fab fa-google"></i> <span data-i18n="btn_google">Sign in with Google</span>
            </button>

            <p style="margin-top: 20px;">
                <span data-i18n="login_no_account">Don't have an account?</span>
                <a href="register.html" data-i18n="login_register_link">Register here</a>
            </p>
        </div>
    </div>

    <footer>
        <p data-i18n="footer_rights">© 2026 Welfare India. All Rights Reserved.</p>
    </footer>

    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    alert(t('login_success'));
                    window.location.href = 'index.html';
                } else {
                    alert(data.error);
                }
            } catch (err) {
                alert(t('login_failed'));
            }
        });

        document.getElementById('google-login-btn').addEventListener('click', async () => {
            const email = prompt(t('google_prompt'), 'user@gmail.com');
            if (email) {
                const name = email.split('@')[0];
                try {
                    const res = await fetch(`${API_BASE_URL}/auth/google`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, name, googleId: 'mock-google-id-' + Date.now() })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                        alert(t('google_success'));
                        window.location.href = 'index.html';
                    } else {
                        alert(data.error);
                    }
                } catch (err) {
                    alert(t('google_failed'));
                }
            }
        });
    </script>
</body>

</html>
